<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SALV Saude | Status da API</title>
  <style>
    :root{--bg:#061225;--panel:rgba(16,46,91,.84);--line:rgba(116,180,255,.24);--text:#f7fbff;--muted:#a9bdd9;--cyan:#38d8e8;--green:#20d99a;--yellow:#ffc857;--red:#ff647c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 82% 7%,rgba(28,112,255,.27),transparent 35%),radial-gradient(circle at 8% 88%,rgba(0,207,191,.13),transparent 30%),linear-gradient(145deg,#030914,var(--bg) 48%,#071932)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:36px 36px}
    .page{position:relative;width:min(1180px,calc(100% - 32px));margin:auto;padding:46px 0 38px}.hero,.panel{border:1px solid var(--line);background:linear-gradient(135deg,rgba(19,55,108,.94),rgba(13,37,75,.78));box-shadow:0 24px 80px rgba(0,0,0,.35);backdrop-filter:blur(16px)}
    .hero{position:relative;overflow:hidden;padding:clamp(28px,5vw,58px);border-radius:26px}.hero:after{content:"";position:absolute;width:320px;height:320px;right:-120px;top:-180px;border-radius:50%;background:rgba(54,184,255,.22)}
    .eyebrow{margin:0 0 13px;color:var(--cyan);font-size:.76rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}h1{position:relative;z-index:1;max-width:850px;margin:0;font-size:clamp(2.25rem,6vw,4.7rem);line-height:.98;letter-spacing:-.055em}
    .summary{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin:28px 0 0;color:#dceaff;font-size:clamp(.95rem,2vw,1.08rem)}.dot{width:15px;height:15px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 7px rgba(255,200,87,.12),0 0 26px currentColor}
    body[data-health=up] .dot{background:var(--green);color:var(--green)}body[data-health=down] .dot{background:var(--red);color:var(--red)}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.metric{padding:19px 20px;border:1px solid var(--line);border-radius:17px;background:rgba(6,20,42,.62)}.metric small{display:block;margin-bottom:7px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.metric strong{font-size:1.08rem}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:34px 2px 16px}h2{margin:0;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.03em}.button{border:1px solid rgba(86,188,255,.45);border-radius:12px;padding:11px 15px;color:var(--text);background:rgba(26,112,207,.28);font:inherit;font-size:.86rem;font-weight:750;cursor:pointer}.button:hover{background:rgba(34,133,240,.42)}.button:disabled{cursor:wait;opacity:.62}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{padding:23px;border-radius:20px}.panel h3{margin:0 0 9px}.endpoint{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;padding:15px 0;border-top:1px solid rgba(129,172,225,.16)}.endpoint:first-of-type{border-top:0}.method{min-width:58px;padding:5px 7px;border-radius:7px;color:#071525;background:var(--cyan);text-align:center;font-size:.69rem;font-weight:900}.post{background:var(--green)}.put,.patch{background:var(--yellow)}.delete{background:var(--red)}.name{margin:1px 0 5px;font-size:.9rem;font-weight:760}.path{color:var(--muted);font:.78rem/1.5 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
    .empty{grid-column:1/-1;padding:34px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center}footer{display:flex;justify-content:space-between;gap:16px;margin-top:24px;color:var(--muted);font-size:.8rem}footer a{color:#a9dcff;text-decoration:none}
    @media(max-width:760px){.metrics,.grid{grid-template-columns:1fr}.section-head,footer{align-items:stretch;flex-direction:column}.button{width:100%}}
  </style>
</head>
<body data-health="checking">
<main class="page">
  <section class="hero" aria-labelledby="title">
    <p class="eyebrow">SALV Saude · Monitoramento</p>
    <h1 id="title">Verificando a API...</h1>
    <p class="summary" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="summary">Consultando a aplicacao e suas dependencias.</span></p>
  </section>
  <section class="metrics" aria-label="Resumo operacional">
    <article class="metric"><small>Aplicacao</small><strong id="app-status">VERIFICANDO</strong></article>
    <article class="metric"><small>Banco de dados</small><strong id="db-status">VERIFICANDO</strong></article>
    <article class="metric"><small>Rotas registradas</small><strong id="route-count">-</strong></article>
  </section>
  <div class="section-head"><div><p class="eyebrow">Contrato publico</p><h2>Endpoints disponiveis</h2></div><button class="button" id="refresh" type="button">Verificar agora</button></div>
  <section class="grid" id="routes" aria-live="polite"><div class="empty">Carregando o contrato OpenAPI...</div></section>
  <footer><span id="last-check">Ultima verificacao: aguardando</span><a href="./swagger-ui/index.html">Abrir documentacao Swagger</a></footer>
</main>
<script>
  const el=id=>document.getElementById(id),ui={title:el("title"),summary:el("summary"),app:el("app-status"),db:el("db-status"),count:el("route-count"),routes:el("routes"),last:el("last-check"),refresh:el("refresh")};
  const names={auth:"Autenticacao",autorizacao:"Autorizacao",meeting:"Atendimento",mensageria:"Mensageria",ocorrencias:"Ocorrencias",sessao:"Sessao",webhook:"Webhook"};
  const group=path=>{const p=path.split("/").filter(Boolean),key=p[0]==="clientes"?p[1]:p[0];return names[key]||"Outros"};
  const empty=message=>{ui.count.textContent="INDISPONIVEL";ui.routes.replaceChildren();const box=document.createElement("div");box.className="empty";box.textContent=message;ui.routes.appendChild(box)};
  function render(api){
    const methods=["get","post","put","patch","delete","head","options"],items=[];
    Object.entries(api.paths||{}).forEach(([path,ops])=>Object.entries(ops).forEach(([method,operation])=>{if(methods.includes(method))items.push({path,method,operation,group:group(path)})}));
    items.sort((a,b)=>a.group.localeCompare(b.group)||a.path.localeCompare(b.path));ui.count.textContent=String(items.length);ui.routes.replaceChildren();
    if(!items.length){empty("Nenhuma rota encontrada no contrato OpenAPI.");return}
    const grouped=items.reduce((all,item)=>{(all[item.group]||=[]).push(item);return all},{});
    Object.entries(grouped).forEach(([title,routes])=>{const panel=document.createElement("article");panel.className="panel";const h=document.createElement("h3");h.textContent=title;panel.appendChild(h);
      routes.forEach(({path,method,operation})=>{const row=document.createElement("div");row.className="endpoint";const badge=document.createElement("span");badge.className=`method ${method}`;badge.textContent=method.toUpperCase();const content=document.createElement("div"),name=document.createElement("p"),route=document.createElement("div");name.className="name";name.textContent=operation.summary||operation.operationId||`${method.toUpperCase()} endpoint`;route.className="path";route.textContent=path;content.append(name,route);row.append(badge,content);panel.appendChild(row)});ui.routes.appendChild(panel)});
  }
  async function json(path){const response=await fetch(path,{cache:"no-store",headers:{Accept:"application/json"}}),body=await response.json();if(!response.ok)throw new Error(`HTTP ${response.status}`);return body}
  async function check(){
    ui.refresh.disabled=true;document.body.dataset.health="checking";ui.title.textContent="Verificando a API...";ui.summary.textContent="Consultando a aplicacao e suas dependencias.";
    const [health,api]=await Promise.allSettled([json("./actuator/health"),json("./v3/api-docs")]);
    if(health.status==="fulfilled"){const data=health.value,up=data.status==="UP";document.body.dataset.health=up?"up":"down";ui.app.textContent=data.status||"DESCONHECIDO";ui.db.textContent=data.components?.db?.status||"NAO INFORMADO";ui.title.textContent=up?"API ativa e funcionando":"API com indisponibilidade";ui.summary.textContent=up?"A aplicacao respondeu e o monitoramento esta operacional.":"Uma dependencia requer atencao."}
    else{document.body.dataset.health="down";ui.app.textContent="INDISPONIVEL";ui.db.textContent="NAO VERIFICADO";ui.title.textContent="API indisponivel";ui.summary.textContent="O healthcheck nao respondeu. Consulte os logs da aplicacao."}
    if(api.status==="fulfilled")render(api.value);else empty("Nao foi possivel carregar o contrato OpenAPI neste momento.");
    ui.last.textContent=`Ultima verificacao: ${new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"medium"}).format(new Date())}`;ui.refresh.disabled=false;
  }
  ui.refresh.addEventListener("click",check);check();window.setInterval(check,60000);
</script>
</body>
</html>
