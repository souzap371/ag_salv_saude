#BANCO ORACLE
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST}:${DB_PORT}/${DB_SERVICE}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.community.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.Oracle12cDialect


#VISUALIZAR AS QUERYS NO CONSOLE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

