spring.application.name=crm

server.port=${SERVER_PORT:26812}

# Token exclusivo para operacoes administrativas da pagina de status.
# Sem esta variavel, o painel de configuracao permanece bloqueado.
painel.admin.token=${PAINEL_ADMIN_TOKEN:}

# Mantém controllers legados preservados no código, mas desativados por padrão.
# Para reativá-los futuramente: FEATURES_LEGACY_ENDPOINTS_ENABLED=true
features.legacy-endpoints.enabled=${FEATURES_LEGACY_ENDPOINTS_ENABLED:false}
features.legacy-autorizacao-sync.enabled=${FEATURES_LEGACY_AUTORIZACAO_SYNC_ENABLED:false}

# O contrato público apresenta somente os módulos em operação.
springdoc.paths-to-match=/clientes/ocorrencias/**,/clientes/mensageria/**

# STATUS PUBLICO DA APLICACAO
# Expoe apenas o healthcheck, sem detalhes internos ou valores sensiveis.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# HTTPS na porta 443
#server.port=443

# SSL
#server.ssl.enabled=true
#server.ssl.key-store=file:/certificado/certificadopfx41915.pfx
#server.ssl.key-store-password=c90de41e23
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=1

#MOUNT ANEXO
# Limite de 10 MiB por anexo armazenado no banco.
storage.database.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:10485760}


#BANCO LOCAL H2mvn 
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.jpa.show-sql=true

#BANCO ORACLE
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST}:${DB_PORT}/${DB_SERVICE}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Migrações versionadas executadas antes da inicialização do Hibernate.
# O baseline preserva o schema legado já existente e aplica somente versões novas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20261015.1
spring.flyway.locations=classpath:db/migration

spring.jpa.database-platform=org.hibernate.community.dialect.Oracle12cDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.Oracle12cDialect

mensageria.scheduler.initial-delay=10000
mensageria.scheduler.fixed-delay=10000

# ============================================================
# SCHEDULER DE MENSAGERIA MOSIA
# ============================================================

# Intervalo entre o término de uma execução
# e o início da próxima.
#
# Valor em milissegundos.
# 10000 = 10 segundos
mensageria.scheduler.fixed-delay=10000


# Tempo após a inicialização da aplicação
# antes da primeira execução do scheduler.
#
# Valor em milissegundos.
# 10000 = 10 segundos
mensageria.scheduler.initial-delay=10000


# Quantidade máxima de mensagens processadas
# em cada execução do scheduler.
mensageria.scheduler.batch-size=100


#VISUALIZAR AS QUERYS NO CONSOLE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL da API Mosia
mosia.api.url=https://api.mosiaomnichannel.com.br/clientes/mensageria/envio
mosia.api.ocorrencia=https://api.mosiaomnichannel.com.br/clientes/ocorrencias


#HIBERNATE CRIA OU ATUALIZA TABELAS OPCOES = none, update, validate, create, create-drop
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update




