version: "3.7"

services:
  crm_mosia:
    image: souzap371/ag_salv_saude:2.0.2

    env_file:
      - ./config/crm/crm.env

    ports:
      - "26812:26812"

    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"

    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

    networks:
      - solus-prd

networks:
  solus-prd: